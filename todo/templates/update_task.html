{% extends "layout.html" %}
{% block title %}Update Task - My Todo App{% endblock title %}

{% block content %}
<div class="update-task-container">
    <div class="update-task-card">
        <a href="{% url 'task_list' %}"><i class="fa-solid fa-arrow-left"></i> back</a>
    <h2>Update Task</h2>
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ task.title }}" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>{{ task.description }}</textarea>
        </div>
        <button type="submit">Update Task</button>
        <a href="{% url 'task_list' %}">Cancel</a>
    </form>
    </div>
</div>
{% endblock content %}
