{% extends "layout.html" %}

{% block title %}Create Task - My Todo App{% endblock title %}

{% block content %}


<div class="create-task-container">
    
    <div class="create-task-card">
        <a href="{% url 'task_list' %}"><i class="fa-solid fa-arrow-left"></i> back</a>
    <form method="post">
        <h2>Create Task</h2>
        {% csrf_token %}
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>
        </div>
        <button type="submit">Create Task</button>
    </form>
    {% for task in tasks_list %}
        <p>{{ task.title }} - {{ task.description }} <a href="{% url 'task_update' task.pk %}"><i class="fa-solid fa-pen-to-square"></i></a> <a href="{% url 'task_delete' task.pk %}"><i class="fa-solid fa-trash-can"></i></a></p>
    {% endfor %}
    </div>
</div>

{% endblock content %}
